name: ci

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # No test script in this repo — API logic and its tests live in arcadia-backend.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_ARCADE_ADDRESS: '0x0000000000000000000000000000000000000001'
          NEXT_PUBLIC_WC_PROJECT_ID: ci
